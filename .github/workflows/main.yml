name: Build and Publish

'on':
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'README.md'
      - 'docs/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/main.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'server/**'
      - 'README.md'
      - 'docs/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Read pinned Rust version
        id: rust-version
        run: |
          python3 -c 'import pathlib, tomllib; print("toolchain=" + tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])' >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        id: rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-version.outputs.toolchain }}
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ${{ runner.os }}-rust-${{ steps.rust.outputs.cachekey }}-cargo-${{ hashFiles('server/Cargo.lock') }}

      - name: Install musl-tools (musl-gcc)
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Check and test
        run: |
          cd ./server
          cargo check --all-targets --locked
          cargo test --locked

      - name: Build
        run: |
          cd ./server
          cargo build --release --target x86_64-unknown-linux-musl --locked

      - name: Strip binary
        run: |
          cd ./server
          strip target/x86_64-unknown-linux-musl/release/remote-party-finder

      - name: Publish Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Remote Party Finder
          path: server/target/x86_64-unknown-linux-musl/release/remote-party-finder

