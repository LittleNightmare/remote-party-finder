[package]
name = "remote-party-finder"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = { version = "1", features = ["backtrace"]}
askama = "0.16.1"
base64 = "0.23.1"
bitflags = "2.13.2"
bson = { version = "2.15", features = ["chrono-0_4"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-humanize = { git = "https://gitlab.com/71e6fd52/chrono-humanize-rs.git" }
ffxiv_types_cn = "1.13.0"
lazy_static = "1"
maplit = "1"
mime = "0.3"
mongodb = "3.9.1"
sestring = { version = "0.3", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-stream = "0.1"
toml = "0.9.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
warp = { version = "0.4.3", default-features = false, features = ["server"] }

[dev-dependencies]
lazy_static = "1"
warp = { version = "0.4.3", default-features = false, features = ["test"] }
